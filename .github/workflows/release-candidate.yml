name: Release Candidate

# The CI stage of the Release Candidate pipeline
# (docs/release/RELEASE_CANDIDATE_WORKFLOW.md). It enforces Static Verification
# and Dependency Audit. It deliberately does NOT run Runtime Acceptance: the
# authenticated /develop workflow requires live Convex and Clerk services that
# are not available to CI, so runtime acceptance stays a recorded manual gate.

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gate:
    name: Static verification and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release-candidate static gate
        run: sh scripts/release-candidate.sh --ci
